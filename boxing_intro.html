<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boxing Bogor - Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Bebas Neue', sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
}

/* ===== PARTICLES BACKGROUND ===== */
#particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}

.particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #E8181A;
    border-radius: 50%;
    opacity: 0;
    animation: particle-float linear infinite;
}

@keyframes particle-float {
    0%   { opacity: 0; transform: translateY(0) scale(0); }
    10%  { opacity: 1; }
    90%  { opacity: .4; }
    100% { opacity: 0; transform: translateY(-100vh) scale(1.5); }
}

/* ===== SHOCKWAVE ===== */
.shockwave {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 200vmax;
    height: 200vmax;
    border-radius: 50%;
    background: transparent;
    border: 2px solid rgba(232, 24, 26, 0.4);
    opacity: 0;
    pointer-events: none;
    z-index: 1;
}
.shockwave.fire {
    animation: shockwave-expand 1s ease-out forwards;
}
@keyframes shockwave-expand {
    0%   { transform: translate(-50%, -50%) scale(0); opacity: .8; }
    100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
}

/* ===== MAIN CONTAINER ===== */
.intro-container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    text-align: center;
    padding: 2rem;
}

/* ===== RING ANIMATION ===== */
.ring-wrap {
    width: min(260px, 70vw);
    height: min(260px, 70vw);
    position: relative;
    margin-bottom: clamp(1.5rem, 4vw, 2.5rem);
}

.ring-orbit {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid transparent;
}
.ring-orbit:nth-child(1) {
    border-top-color: #E8181A;
    border-right-color: #E8181A;
    animation: orbit 1.8s linear infinite;
    box-shadow: 0 0 12px rgba(232,24,26,.3);
}
.ring-orbit:nth-child(2) {
    inset: 14px;
    border-bottom-color: #C8A850;
    border-left-color: #C8A850;
    animation: orbit 2.8s linear infinite reverse;
    box-shadow: 0 0 8px rgba(200,168,80,.2);
}
.ring-orbit:nth-child(3) {
    inset: 28px;
    border-top-color: rgba(255,255,255,.15);
    border-right-color: rgba(255,255,255,.15);
    animation: orbit 4s linear infinite;
}
.ring-orbit:nth-child(4) {
    inset: 42px;
    border-bottom-color: rgba(232,24,26,.3);
    animation: orbit 5s linear infinite reverse;
}

@keyframes orbit { to { transform: rotate(360deg); } }

.ring-core {
    position: absolute;
    inset: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #1c0000, #000 70%);
    border: 1px solid rgba(232,24,26,.2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.ring-core::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 0%, rgba(232,24,26,.15), transparent 60%);
    animation: core-glow 2s ease-in-out infinite alternate;
}

@keyframes core-glow {
    0%   { opacity: .5; }
    100% { opacity: 1; }
}

.fist-icon {
    width: 55%;
    height: 55%;
    fill: #E8181A;
    filter: drop-shadow(0 0 16px rgba(232,24,26,.9));
    animation: fist-punch 1.6s cubic-bezier(.36,.07,.19,.97) infinite;
    position: relative;
    z-index: 1;
}

@keyframes fist-punch {
    0%   { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 12px rgba(232,24,26,.7)); }
    40%  { transform: scale(1.12) rotate(2deg); filter: drop-shadow(0 0 28px rgba(232,24,26,1)); }
    60%  { transform: scale(1.08) rotate(0deg); }
    100% { transform: scale(1) rotate(-3deg); filter: drop-shadow(0 0 12px rgba(232,24,26,.7)); }
}

/* Orbit dots */
.orbit-dot {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    top: calc(50% - 3px);
    left: -3px;
    transform-origin: calc(50% + 3px + calc(min(260px,70vw) / 2)) 3px;
}
.orbit-dot:nth-child(5) {
    background: #E8181A;
    box-shadow: 0 0 6px #E8181A;
    animation: orbit 1.8s linear infinite;
}
.orbit-dot:nth-child(6) {
    background: #C8A850;
    box-shadow: 0 0 6px #C8A850;
    width: 4px; height: 4px;
    top: calc(50% - 2px);
    transform-origin: calc(50% + 2px + calc(min(260px,70vw) / 2 - 14px)) 2px;
    animation: orbit 2.8s linear infinite reverse;
}

/* ===== TEXT BLOCK ===== */
.intro-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(.65rem, 2.5vw, .8rem);
    letter-spacing: .4em;
    text-transform: uppercase;
    color: #C8A850;
    opacity: 0;
    animation: text-rise .7s ease .3s forwards;
    margin-bottom: .6rem;
}

.intro-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 9vw, 4.2rem);
    letter-spacing: .12em;
    line-height: 1;
    opacity: 0;
    animation: text-rise .7s ease .5s forwards;
}
.intro-title .red { color: #E8181A; }

.intro-subtitle {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(.75rem, 3vw, 1rem);
    letter-spacing: .25em;
    text-transform: uppercase;
    color: rgba(245,240,235,.5);
    margin-top: .5rem;
    opacity: 0;
    animation: text-rise .7s ease .7s forwards;
}

/* ===== PROGRESS BAR ===== */
.progress-wrap {
    width: min(320px, 75vw);
    margin-top: clamp(1.5rem, 4vw, 2rem);
    opacity: 0;
    animation: text-rise .5s ease .9s forwards;
}
.progress-track {
    height: 2px;
    background: rgba(255,255,255,.08);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
}
.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #E8181A, #C8A850);
    border-radius: 2px;
    animation: progress-run 2.8s cubic-bezier(.4,0,.2,1) 1s forwards;
    box-shadow: 0 0 8px rgba(232,24,26,.6);
}
@keyframes progress-run { to { width: 100%; } }

.progress-label {
    display: flex;
    justify-content: space-between;
    margin-top: .5rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(.6rem, 2vw, .7rem);
    letter-spacing: .15em;
    color: rgba(255,255,255,.3);
}

/* ===== CORNER DECORATIONS ===== */
.corner {
    position: fixed;
    width: 40px;
    height: 40px;
    opacity: 0;
    animation: corner-appear .5s ease .2s forwards;
}
.corner-tl { top: clamp(12px,3vw,24px); left: clamp(12px,3vw,24px); border-top: 1.5px solid rgba(232,24,26,.5); border-left: 1.5px solid rgba(232,24,26,.5); }
.corner-tr { top: clamp(12px,3vw,24px); right: clamp(12px,3vw,24px); border-top: 1.5px solid rgba(232,24,26,.5); border-right: 1.5px solid rgba(232,24,26,.5); }
.corner-bl { bottom: clamp(12px,3vw,24px); left: clamp(12px,3vw,24px); border-bottom: 1.5px solid rgba(232,24,26,.5); border-left: 1.5px solid rgba(232,24,26,.5); }
.corner-br { bottom: clamp(12px,3vw,24px); right: clamp(12px,3vw,24px); border-bottom: 1.5px solid rgba(232,24,26,.5); border-right: 1.5px solid rgba(232,24,26,.5); }
@keyframes corner-appear { to { opacity: 1; } }

/* ===== SCANLINE EFFECT ===== */
.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,.03) 2px,
        rgba(0,0,0,.03) 4px
    );
}

/* ===== FLASH OVERLAY ===== */
.flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 50;
}
.flash.fire {
    animation: flash-out .4s ease forwards;
}
@keyframes flash-out {
    0%   { opacity: .25; }
    100% { opacity: 0; }
}

@keyframes text-rise {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div id="particles"></div>
<div class="shockwave" id="shockwave"></div>
<div class="scanlines"></div>
<div class="flash" id="flash"></div>

<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>

<div class="intro-container">
    <div class="ring-wrap">
        <div class="ring-orbit"></div>
        <div class="ring-orbit"></div>
        <div class="ring-orbit"></div>
        <div class="ring-orbit"></div>
        <div class="orbit-dot"></div>
        <div class="orbit-dot"></div>
        <div class="ring-core">
            <svg class="fist-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M72 45c0-3-2-5-5-5h-5V28c0-3-2-5-5-5s-5 2-5 5v6c-.5-2.5-2.5-4-5-4s-5 2-5 5v2c-.5-2-2.5-3.5-5-3.5s-5 2-5 5v10c0 2 .5 4 1.5 6L35 72c1 3 4 5 7 5h20c4 0 7-3 8-7l3-10c.7-2 1-4 1-6v-1h2c1 0 2-1 2-3l-5-5h-1zm-12-17v18h-4V28c0-1 .5-2 2-2s2 1 2 2zm-10 4v14h-4V32c0-1.5 1-2.5 2-2.5s2 1 2 2.5zm-10 2v12h-4V34c0-1.5 1-2 2-2s2 .5 2 2z"/>
            </svg>
        </div>
    </div>

    <div class="intro-eyebrow">Est. 2018 &nbsp;·&nbsp; Bogor, Jawa Barat</div>
    <div class="intro-title">PERSATUAN <span class="red">BOXING</span> BOGOR</div>
    <div class="intro-subtitle">Fighting Spirit &nbsp;·&nbsp; Disiplin &nbsp;·&nbsp; Prestasi</div>

    <div class="progress-wrap">
        <div class="progress-track">
            <div class="progress-fill"></div>
        </div>
        <div class="progress-label">
            <span>Memuat...</span>
            <span>Boxing Bogor</span>
        </div>
    </div>
</div>

<script>
    // Generate floating particles
    var container = document.getElementById('particles');
    for (var i = 0; i < 35; i++) {
        (function(i) {
            var p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-10px';
            p.style.width = (Math.random() * 3 + 1) + 'px';
            p.style.height = p.style.width;
            p.style.animationDuration = (Math.random() * 6 + 4) + 's';
            p.style.animationDelay = (Math.random() * 5) + 's';
            if (Math.random() > 0.6) p.style.background = '#C8A850';
            container.appendChild(p);
        })(i);
    }

    // Shockwave on fist pulse
    var sw = document.getElementById('shockwave');
    var fl = document.getElementById('flash');
    setInterval(function() {
        sw.classList.remove('fire');
        fl.classList.remove('fire');
        void sw.offsetWidth;
        sw.classList.add('fire');
        fl.classList.add('fire');
    }, 1600);

    // Notify parent when done (3.2s)
    setTimeout(function() {
        if (window.parent && window.parent !== window) {
            window.parent.postMessage('intro-done', '*');
        }
    }, 3200);
</script>
</body>
</html>
